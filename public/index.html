<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alphabet & Word Learning App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
      
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    /* Modal Styling - Ensuring it is visible by default via CSS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex; /* Default is flex (visible) */
      justify-content: center; align-items: center;
      z-index: 2000; /* High z-index to ensure it is on top */
    }
    
    .modal-content {
      background-color: white; padding: 30px 40px; border-radius: 15px;
      text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h2 { margin-top: 0; color: #333; }
    .modal-content button {
      display: block; width: 100%; padding: 15px 30px; font-size: 18px;
      cursor: pointer; border: 2px solid #007bff; background-color: white;
      color: #007bff; border-radius: 8px; margin-top: 15px;
      transition: background-color 0.3s, color 0.3s;
    }
    .modal-content button:hover { background-color: #007bff; color: white; }

    /* Mode Containers - Hidden by default */
    .mode-container {
      width: 100%; display: none; flex-direction: column; align-items: center;
    }
    
    /* --- ALPHABET MODE STYLES --- */
    .box-container {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 20px;
    }
    .box {
      width: 100px; height: 100px; background-image: url('https://img.icons8.com/color/96/gift.png');
      background-size: cover; background-position: center; border: none;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .box.open { background-image: none; }
    .letter {
      font-size: 3rem; font-weight: bold; color: #000; display: none;
      animation: pop-in 0.5s ease forwards;
    }
    .box.open .letter { display: block; }
    @keyframes pop-in {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .restart-btn {
      margin-top: 10px; padding: 10px 20px; font-size: 16px; background-color: #4caf50;
      color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    .restart-btn:hover { background-color: #45a049; }
    .settings-btn {
      margin-top: 10px; padding: 8px 15px; font-size: 14px; background-color: #007bff;
      color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    .settings-btn:hover { background-color: #0056b3; }
    .font-settings { display: none; margin-top: 20px; }
    .font-settings label { margin-right: 10px; }
    .image-container {
      margin-top: 20px; min-height: 160px; max-width: 100%; display: flex;
      flex-direction: column; align-items: center;
    }
    .image-container img {
      max-width: 150px; border: 2px solid #ddd; border-radius: 10px;
      padding: 5px; background-color: white;
    }
    
    /* --- WRITING MODE STYLES --- */
    #wordSelectionContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
      max-width: 600px;
    }
    .word-thumbnail {
      width: 80px;
      height: 80px;
      border: 2px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      background-color: white;
      padding: 5px;
    }
    .word-thumbnail:hover {
      transform: scale(1.05);
      border-color: #007bff;
    }
    .word-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
    }
    
    #writingGameContainer {
      display: none;
      flex-direction: column;
      align-items: center;
    }
    #wordImageContainer {
      min-height: 160px; display: flex; align-items: center; justify-content: center;
    }
    #wordImageContainer img {
      max-width: 150px; border: 2px solid #ddd; border-radius: 10px;
      padding: 5px; background-color: white;
    }
    #wordFormationContainer { display: flex; gap: 10px; height: 60px; margin-top: 10px; }
    .letter-placeholder {
      width: 50px; height: 50px; border: 2px dashed #ccc; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: bold;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .letter-placeholder.filled {
      border-color: #28a745; border-style: solid;
      background-color: #28a745; color: white;
    }
    #letterChoicesContainer {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 10px; padding: 10px; max-width: 500px;
    }
    .letter-choice {
      width: 50px; height: 50px; background-color: #007bff; color: white;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: bold; cursor: pointer;
      transition: background-color 0.3s, transform 0.5s ease;
    }
    .letter-choice:hover { background-color: #0056b3; }
    .letter-choice.moving {
        transition: transform 0.5s ease-in-out;
        z-index: 100; background-color: #28a745;
    }
    .back-to-selection-btn {
        margin-top: 10px; padding: 10px 20px; font-size: 16px; background-color: #6c757d;
        color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    .back-to-selection-btn:hover { background-color: #545b62; }
    .next-word-btn {
        margin-top: 10px; padding: 10px 20px; font-size: 16px; background-color: #4caf50;
        color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    .next-word-btn:hover { background-color: #45a049; }

    /* --- ARITHMETIC MODE STYLES --- */
    #arithmeticMode {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 229, 110, 0.35), transparent 24%),
        radial-gradient(circle at 78% 18%, rgba(89, 196, 255, 0.28), transparent 22%),
        linear-gradient(135deg, #101c3f 0%, #1d3d6f 46%, #17314f 100%);
      color: white;
      justify-content: stretch;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    .superhero-stage {
      width: 100%;
      min-height: calc(100vh - 118px);
      display: grid;
      grid-template-columns: 30% 70%;
      align-items: stretch;
      position: relative;
      padding: 18px 22px 8px;
      box-sizing: border-box;
    }

    .hero-zone,
    .opponent-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-width: 0;
    }

    .hero-card {
      width: min(92%, 260px);
      height: min(64vh, 340px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s ease, filter 0.45s ease;
      transform-origin: center;
    }

    .hero-card.power-up {
      transform: scale(1.12);
      filter: drop-shadow(0 0 26px rgba(255, 227, 89, 0.95));
    }

    .hero-card img,
    .opponent-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    .opponent-zone {
      gap: 5vw;
      padding-right: 3vw;
    }

    .opponent-card {
      width: min(36%, 260px);
      height: min(60vh, 330px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      transform-origin: center 62%;
      transition: filter 0.25s ease;
    }

    .defense-stat {
      font-size: clamp(4rem, 9vw, 6.4rem);
      line-height: 0.9;
      font-weight: 900;
      color: #fff8a8;
      text-shadow: 0 5px 0 #12315f, 0 0 22px rgba(255, 240, 128, 0.8);
      margin-bottom: 4px;
    }

    .opponent-card.teleport {
      animation: opponent-teleport 0.95s ease-in forwards;
      filter: drop-shadow(0 0 22px rgba(109, 244, 255, 0.9));
    }

    .math-beam {
      position: absolute;
      left: 23%;
      top: 48%;
      width: 0;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fffbe8 0%, #ffe45f 34%, #55e8ff 72%, rgba(85, 232, 255, 0) 100%);
      box-shadow: 0 0 18px #fff2a8, 0 0 34px rgba(91, 233, 255, 0.9);
      transform: rotate(-4deg);
      transform-origin: left center;
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    .math-beam.active {
      animation: math-beam 0.8s ease-out forwards;
    }

    .sparkle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 8;
    }

    .sparkle {
      position: absolute;
      width: 18px;
      height: 18px;
      color: var(--sparkle-color, #ffe45f);
      transform: translate(-50%, -50%) scale(0);
      animation: sparkle-pop 900ms ease-out forwards;
    }

    .sparkle::before,
    .sparkle::after {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      clip-path: polygon(50% 0, 62% 36%, 100% 50%, 62% 64%, 50% 100%, 38% 64%, 0 50%, 38% 36%);
    }

    .sparkle::after {
      transform: rotate(45deg) scale(0.62);
      opacity: 0.8;
    }

    .great-job-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(3.2rem, 10vw, 7.5rem);
      font-weight: 900;
      letter-spacing: 0;
      color: #ffffff;
      text-shadow: 0 7px 0 #1a5596, 0 0 28px rgba(255, 245, 117, 0.95);
      opacity: 0;
      transform: scale(0.84);
      pointer-events: none;
      z-index: 12;
    }

    .great-job-overlay.show {
      animation: great-job 1.25s ease-out forwards;
    }

    .control-deck {
      width: 100%;
      min-height: 118px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1vw, 14px);
      padding: 12px 14px 18px;
      box-sizing: border-box;
      background: rgba(4, 16, 36, 0.76);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
    }

    .math-number-choice {
      width: clamp(48px, 8.4vw, 92px);
      height: clamp(54px, 9vw, 96px);
      border: 3px solid rgba(255, 255, 255, 0.72);
      border-radius: 16px;
      color: #10223e;
      font-size: clamp(2rem, 4.6vw, 4rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.22), inset 0 2px 0 rgba(255, 255, 255, 0.55);
      transition: transform 0.12s ease, filter 0.18s ease, box-shadow 0.18s ease;
      touch-action: manipulation;
    }

    .math-number-choice:nth-child(5n + 1) { background: #ffdd57; }
    .math-number-choice:nth-child(5n + 2) { background: #6ee7b7; }
    .math-number-choice:nth-child(5n + 3) { background: #7dd3fc; }
    .math-number-choice:nth-child(5n + 4) { background: #fca5a5; }
    .math-number-choice:nth-child(5n) { background: #c4b5fd; }

    .math-number-choice:hover,
    .math-number-choice:focus-visible {
      transform: translateY(-3px) scale(1.04);
      filter: brightness(1.06);
      outline: none;
    }

    .math-number-choice.selected {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.32), 0 0 0 5px rgba(255, 255, 255, 0.28);
    }

    .math-number-choice.try-again {
      animation: math-shake 0.5s ease-in-out;
    }

    .math-number-choice.success {
      animation: correct-bounce 0.6s ease;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.32), 0 0 24px rgba(118, 255, 190, 0.95);
    }

    .superhero-back-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      margin: 0;
      padding: 9px 13px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      background: rgba(9, 29, 56, 0.72);
      color: white;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    @keyframes math-shake {
      0%, 100% { transform: translateX(0); }
      18% { transform: translateX(-10px) rotate(-2deg); }
      36% { transform: translateX(9px) rotate(2deg); }
      54% { transform: translateX(-7px) rotate(-1deg); }
      72% { transform: translateX(5px) rotate(1deg); }
    }

    @keyframes math-beam {
      0% { width: 0; opacity: 0; }
      18% { opacity: 1; }
      72% { width: 59%; opacity: 1; }
      100% { width: 59%; opacity: 0; }
    }

    @keyframes opponent-teleport {
      0% { transform: rotate(0deg) scale(1); opacity: 1; }
      55% { transform: rotate(210deg) scale(0.72); opacity: 0.95; }
      100% { transform: rotate(540deg) scale(0.08); opacity: 0; }
    }

    @keyframes sparkle-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(0deg); }
      28% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--sparkle-x)), calc(-50% + var(--sparkle-y))) scale(1.4) rotate(220deg);
      }
    }

    @keyframes great-job {
      0% { opacity: 0; transform: scale(0.84); }
      20% { opacity: 1; transform: scale(1.06); }
      78% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.12); }
    }

    @media (max-height: 540px) and (orientation: landscape) {
      .superhero-stage {
        min-height: calc(100vh - 92px);
        padding-top: 10px;
      }

      .hero-card,
      .opponent-card {
        height: 52vh;
      }

      .control-deck {
        min-height: 92px;
        padding: 8px 10px 10px;
      }

      .math-number-choice {
        border-radius: 12px;
      }
    }

    @media (orientation: portrait) {
      .superhero-stage {
        grid-template-columns: 1fr;
        grid-template-rows: 36% 64%;
        min-height: calc(100vh - 210px);
        padding-top: 50px;
      }

      .hero-card {
        height: 24vh;
      }

      .opponent-zone {
        gap: 3vw;
        padding-right: 0;
      }

      .opponent-card {
        width: 42%;
        height: 34vh;
      }

      .control-deck {
        flex-wrap: wrap;
        min-height: 210px;
      }

      .math-beam.active {
        animation-name: math-beam-portrait;
      }
    }

    @keyframes math-beam-portrait {
      0% { width: 0; opacity: 0; }
      18% { opacity: 1; }
      72% { width: 52%; opacity: 1; }
      100% { width: 52%; opacity: 0; }
    }
    
    .apples-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 30px;
      margin: 20px 0;
      min-height: 120px;
    }
    
    .apple-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .apple-group-label {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    
    .apples-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 150px;
      gap: 5px;
    }
    
    .apple {
      width: 30px;
      height: 30px;
      background-color: #ff4444;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      position: relative;
      margin: 2px;
    }
    
    .apple::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 8px;
      background-color: #8B4513;
      border-radius: 2px;
    }
    
    .apple::after {
      content: '';
      position: absolute;
      top: -2px;
      right: 8px;
      width: 8px;
      height: 6px;
      background-color: #228B22;
      border-radius: 50%;
      transform: rotate(20deg);
    }
    
    #numberChoicesContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
      max-width: 400px;
    }
    
    .number-choice {
      width: 60px;
      height: 60px;
      background-color: #ff6b35;
      color: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
      border: none;
    }
    
    .number-choice:hover {
      background-color: #e55a2b;
      transform: scale(1.05);
    }
    
    .number-choice.correct, .lowercase-choice.correct, .reading-choice.correct {
      background-color: #28a745 !important;
      animation: correct-bounce 0.6s ease;
    }
    
    .number-choice.incorrect, .lowercase-choice.incorrect, .reading-choice.incorrect {
      background-color: #dc3545 !important;
      animation: shake 0.5s ease-in-out;
    }
    
    @keyframes correct-bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
      20%, 40%, 60%, 80% { transform: translateX(8px); }
    }
    
    .letter-choice.incorrect {
        animation: shake 0.5s ease-in-out; background-color: #dc3545;
    }
    
    .next-problem-btn {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }
    
    .next-problem-btn:hover {
      background-color: #45a049;
    }

    /* --- LOWERCASE MODE STYLES --- */
    .lowercase-target-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin: 20px 0;
        padding: 20px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .lowercase-target-letter {
        font-size: 5rem;
        font-weight: bold;
        color: #007bff;
        font-family: Arial, sans-serif;
    }
    .lowercase-target-img img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 8px;
    }
    #lowercaseChoicesContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        max-width: 500px;
        padding: 10px;
    }
    .lowercase-choice {
        width: 60px;
        height: 60px;
        background-color: #6f42c1;
        color: white;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s;
        border: none;
    }
    .lowercase-choice:hover {
        background-color: #5a32a3;
        transform: scale(1.05);
    }

    /* --- READING MODE STYLES --- */
    #readingTargetWord {
      font-size: 4rem;
      font-weight: bold;
      color: #333;
      margin: 10px 0;
      letter-spacing: 2px;
    }
    #readingPhaseLabel {
      font-size: 1rem;
      font-weight: bold;
      color: #1f6feb;
      margin-top: 8px;
    }
    #readingInstruction {
      font-size: 1.05rem;
      color: #444;
      margin: 4px 0 8px;
      min-height: 24px;
      text-align: center;
    }
    #readingChoicesContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 10px;
      max-width: 700px;
    }
    .reading-choice {
      width: 140px;
      height: 140px;
      border: 3px solid #ddd;
      border-radius: 15px;
      cursor: pointer;
      background-color: white;
      padding: 5px;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reading-choice:hover {
      transform: scale(1.05);
      border-color: #007bff;
    }
    .reading-choice img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      object-fit: contain;
    }
    .reading-choice.correct {
      border-color: #28a745;
      background-color: #e8f5e9;
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(40, 167, 69, 0.5);
    }
    .reading-choice.incorrect {
      border-color: #dc3545;
    }
    .reading-settings {
        display: none;
        margin-top: 15px;
        background: #fff;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    #readingParentControls {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .parent-rating-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .parent-rating-btn.correct { background: #28a745; }
    .parent-rating-btn.almost { background: #f39c12; }
    .parent-rating-btn.help { background: #dc3545; }

  </style>
</head>
<body>

  <div id="startupModal" class="modal-overlay">
    <div class="modal-content">
      <h2>Choose a Mode</h2>
      <button onclick="initializeMode('lowercase')">Match Lowercase</button>
      <button onclick="initializeMode('alphabet')">Learn Alphabet</button>
      <button onclick="initializeMode('reading')">Learn Reading</button>
      <button onclick="initializeMode('writing')">Practice Writing</button>
      <button onclick="initializeMode('arithmetic')">Learn Arithmetic</button>
      <button onclick="initializeMode('digits')">Learn Digits</button>
    </div>
  </div>

  <div id="alphabetMode" class="mode-container">
    <div class="box-container" id="boxContainer"></div>
    <button class="settings-btn" onclick="toggleFontSettings()">Settings</button>
    <button class="restart-btn" onclick="resetBoxes()">Restart</button>
    <div class="font-settings" id="fontSettings">
      <div>
        <label for="fontSelector">Choose a font:</label>
        <select id="fontSelector" onchange="changeFont(this.value)">
          <option value="Arial">Arial</option>
          <option value="Comic Sans MS">Comic Sans MS</option>
          <option value="Verdana">Verdana</option>
        </select>
      </div>
      <div style="margin-top: 10px;">
        <label for="caseSelector">Letter Case:</label>
        <select id="caseSelector" onchange="changeCase(this.value)">
          <option value="uppercase">Uppercase</option>
          <option value="lowercase">Lowercase</option>
          <option value="mixed">Mixed</option>
        </select>
      </div>
    </div>
    <div class="image-container" id="imageContainer"></div>
  </div>

  <div id="lowercaseMode" class="mode-container">
      <div class="lowercase-target-container">
          <div class="lowercase-target-img" id="lowercaseTargetImgContainer"></div>
          <div class="lowercase-target-letter" id="lowercaseTargetLetterDisplay"></div>
      </div>
      <h3 style="margin: 0 0 15px 0; color: #666;">Choose the lowercase letter:</h3>
      <div id="lowercaseChoicesContainer"></div>
      <button class="next-problem-btn" onclick="generateLowercaseProblem()">Next</button>
      <button class="back-to-selection-btn" onclick="backToModeSelection()">Back to Menu</button>
  </div>

  <div id="readingMode" class="mode-container">
    <div id="readingPhaseLabel"></div>
    <div id="readingTargetWord"></div>
    <div id="readingInstruction"></div>
    <div id="readingChoicesContainer"></div>
    <div id="readingParentControls">
      <button class="parent-rating-btn correct" onclick="rateReadingDecode('correct')">Correct</button>
      <button class="parent-rating-btn almost" onclick="rateReadingDecode('almost')">Almost</button>
      <button class="parent-rating-btn help" onclick="rateReadingDecode('needs_help')">Needs Help</button>
    </div>
    
    <button class="settings-btn" onclick="toggleReadingSettings()">Settings</button>
    <div class="reading-settings" id="readingSettings">
        <label for="readingCaseSelector">Word Case:</label>
        <select id="readingCaseSelector" onchange="changeReadingCase(this.value)">
          <option value="uppercase" selected>Uppercase</option>
          <option value="lowercase">Lowercase</option>
        </select>
    </div>

    <button class="next-problem-btn" onclick="handleReadingNextStep()">Next</button>
    <button class="back-to-selection-btn" onclick="backToModeSelection()">Back to Menu</button>
  </div>

  <div id="writingMode" class="mode-container">
    <div id="wordSelectionContainer"></div>
    <div id="writingGameContainer">
      <div id="wordImageContainer"></div>
      <div id="wordFormationContainer"></div>
      <div id="letterChoicesContainer"></div>
      <button class="back-to-selection-btn" onclick="showWordSelection()">Back to Word Selection</button>
      <button class="next-word-btn" style="display: none;" onclick="showWordSelection()">Select Another Word</button>
    </div>
  </div>

  <div id="arithmeticMode" class="mode-container">
    <button class="superhero-back-btn" onclick="backToModeSelection()">Menu</button>
    <div class="superhero-stage">
      <div class="hero-zone">
        <div class="hero-card" id="mathHeroCard"></div>
      </div>
      <div class="opponent-zone" id="mathOpponentZone"></div>
      <div class="math-beam" id="mathBeam"></div>
      <div class="sparkle-layer" id="mathSparkleLayer"></div>
      <div class="great-job-overlay" id="mathGreatJob">GREAT JOB!</div>
    </div>
    <div class="control-deck" id="numberChoicesContainer"></div>
  </div>

  <div id="digitsMode" class="mode-container">
    <div class="apples-container" id="digitsApplesContainer"></div>
    <div id="digitsNumberChoicesContainer"></div>
    <button class="next-problem-btn" onclick="generateDigitsProblem()">Next</button>
    <button class="back-to-selection-btn" onclick="backToModeSelection()">Back to Menu</button>
  </div>
  

  <script>

    /* --- ALPHABET MODE SCRIPT --- */
    const alphabet = 'ABCDEFGHIJKLMNOPRSTUWZ';
    let usedLetters = [];
    const letterToWordAndImage = {
      A: 'arbuz', B: 'banan', C: 'cytryna', D: 'dynia', E: 'everest', G: 'gruszka',
      H: 'helikopter', I: 'indyk', J: 'jablko', K: 'kot', L: 'lody', M: 'mama',
      N: 'noz', O: 'okno', P: 'pies', R: 'rower', S: 'slonce', T: 'tata', U: 'ul',
      W: 'warsztat', Z: 'zebra'
    };
    
    function getRandomLetter(caseType) {
      let availableLetters = alphabet.split('').filter(letter => !usedLetters.includes(letter));
      if (availableLetters.length === 0) {
        generateAlphabetBoxes();
        usedLetters = [];
        availableLetters = alphabet.split('');
      }
      let randomIndex = Math.floor(Math.random() * availableLetters.length);
      let letter = availableLetters[randomIndex];
      
      // Determine Case
      if (caseType === 'lowercase') {
          letter = letter.toLowerCase();
      } else if (caseType === 'mixed') {
          letter = Math.random() > 0.5 ? letter.toLowerCase() : letter;
      }
      // Used letters are always stored as Uppercase to avoid duplicates like 'a' and 'A' in the same session
      usedLetters.push(letter.toUpperCase());
      return letter;
    }

    function openBox(box) {
      if (!box.classList.contains('open')) {
        const caseSetting = document.getElementById('caseSelector').value;
        const letter = getRandomLetter(caseSetting);
        
        if (!letter) return;
        
        box.querySelector('.letter').textContent = letter;
        box.classList.add('open');
        
        const letterKey = letter.toUpperCase();
        if (letterToWordAndImage[letterKey]) {
          displayImage(`img/${letterToWordAndImage[letterKey]}.jpeg`);
        }
        
        if (Array.from(document.querySelectorAll('.box')).every(b => b.classList.contains('open'))) {
          document.querySelector('.restart-btn').style.display = 'block';
        }
      }
    }

    function displayImage(image) { document.getElementById('imageContainer').innerHTML = `<img src="${image}" alt="">`; }
    function generateAlphabetBoxes() {
      const boxContainer = document.getElementById('boxContainer');
      boxContainer.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const boxDiv = document.createElement('div');
        boxDiv.className = 'box';
        boxDiv.onclick = function() { openBox(this); };
        boxDiv.appendChild(document.createElement('div')).className = 'letter';
        boxContainer.appendChild(boxDiv);
      }
    }
    function resetBoxes() {
      generateAlphabetBoxes();
      document.querySelector('#alphabetMode .restart-btn').style.display = 'none';
      document.getElementById('imageContainer').innerHTML = '';
    }
    function toggleFontSettings() {
      const fontSettings = document.getElementById('fontSettings');
      fontSettings.style.display = fontSettings.style.display === 'none' ? 'block' : 'none';
    }
    function changeFont(font) {
      document.querySelectorAll('.letter, .letter-placeholder, .letter-choice, .lowercase-target-letter, .lowercase-choice, #readingTargetWord').forEach(el => el.style.fontFamily = font);
    }
    function changeCase(caseType) { resetBoxes(); }
    function preloadImages() {
      Object.values(letterToWordAndImage).forEach(word => {
        const img = new Image();
        img.src = `img/${word}.jpeg`;
      });
    }

    /* --- MATCH LOWERCASE MODE SCRIPT --- */
    let currentLowercaseTargetLetter = '';
    let isLowercaseAnimating = false;
    
    // Algorithm State
    let lowercasePool = [];         
    let lowercaseFailed = [];       
    let lowercaseLastTarget = null; 
    let lowercaseLastOptions = [];  
    let lowercaseCurrentAttemptFailed = false;

    function initializeLowercasePool() {
        lowercasePool = alphabet.split('').sort(() => Math.random() - 0.5);
        lowercaseFailed = [];
        lowercaseLastTarget = null;
        lowercaseLastOptions = [];
    }

    function generateLowercaseProblem() {
        document.querySelector('#lowercaseMode .next-problem-btn').style.display = 'none';
        isLowercaseAnimating = false;
        lowercaseCurrentAttemptFailed = false;

        let selectedChar = null;
        const retryCandidateIndex = lowercaseFailed.findIndex(c => c !== lowercaseLastTarget);
        
        if (retryCandidateIndex !== -1) {
            selectedChar = lowercaseFailed[retryCandidateIndex];
            lowercaseFailed.splice(retryCandidateIndex, 1);
        } else if (lowercasePool.length > 0) {
            selectedChar = lowercasePool.shift();
        } else if (lowercaseFailed.length > 0) {
            selectedChar = lowercaseFailed.shift();
        } else {
            alert("Great job! Restarting alphabet.");
            initializeLowercasePool();
            selectedChar = lowercasePool.shift();
        }

        lowercaseLastTarget = selectedChar; 
        currentLowercaseTargetLetter = selectedChar.toLowerCase();

        const displayLetter = document.getElementById('lowercaseTargetLetterDisplay');
        const displayImgContainer = document.getElementById('lowercaseTargetImgContainer');
        
        displayLetter.textContent = selectedChar; 
        
        if (letterToWordAndImage[selectedChar]) {
            displayImgContainer.innerHTML = `<img src="img/${letterToWordAndImage[selectedChar]}.jpeg" alt="${letterToWordAndImage[selectedChar]}">`;
        } else {
            displayImgContainer.innerHTML = ''; 
        }

        let allChars = alphabet.split('').map(c => c.toLowerCase());
        let potentialDistractors = allChars.filter(c => c !== currentLowercaseTargetLetter);
        const fullyFreshDistractors = potentialDistractors.filter(c => !lowercaseLastOptions.includes(c));
        let sourceDistractors = fullyFreshDistractors.length >= 5 ? fullyFreshDistractors : potentialDistractors;
        
        sourceDistractors.sort(() => Math.random() - 0.5);
        let distractors = sourceDistractors.slice(0, 5);
        
        let choices = [currentLowercaseTargetLetter, ...distractors];
        choices.sort(() => Math.random() - 0.5);
        lowercaseLastOptions = [...choices];

        const choicesContainer = document.getElementById('lowercaseChoicesContainer');
        choicesContainer.innerHTML = '';
        
        choices.forEach(l => {
            const btn = document.createElement('button');
            btn.className = 'lowercase-choice';
            btn.textContent = l;
            btn.onclick = () => selectLowercaseChoice(btn, l);
            choicesContainer.appendChild(btn);
        });
        
        changeFont(document.getElementById('fontSelector').value || 'Arial');
    }

    function selectLowercaseChoice(btn, letter) {
        if (isLowercaseAnimating) return;
        isLowercaseAnimating = true;

        if (letter === currentLowercaseTargetLetter) {
            btn.classList.add('correct');
            if (lowercaseCurrentAttemptFailed) {
                 lowercaseFailed.push(currentLowercaseTargetLetter.toUpperCase());
            }
            setTimeout(() => {
                document.querySelector('#lowercaseMode .next-problem-btn').style.display = 'inline-block';
                isLowercaseAnimating = false;
            }, 600);
        } else {
            lowercaseCurrentAttemptFailed = true;
            btn.classList.add('incorrect');
            setTimeout(() => {
                btn.classList.remove('incorrect');
                isLowercaseAnimating = false;
            }, 500);
        }
    }

    /* --- READING MODE SCRIPT --- */
    let readingCurrentWord = '';
    let readingCase = 'uppercase'; // Default
    let isReadingAnimating = false;
    const readingWords = ['mama', 'tata', 'dom', 'kot', 'ul', 'oko', 'ola', 'osa'];
    const readingSessionSize = 5;
    let readingCurrentStage = 'teach';
    let readingGuidedRemaining = 0;
    let readingStandardRemaining = 0;
    let readingWordHadMistake = false;
    let readingTrialHadMistake = false;
    let readingSessionWords = [];
    let readingSessionWordIndex = 0;
    let readingReviewWords = [];
    let readingInReview = false;
    let readingReviewIndex = 0;
    const readingStats = {};

    readingWords.forEach(word => {
      readingStats[word] = { shown: 0, correctFirstTry: 0, mistakes: 0, lastSeen: null };
    });

    function toggleReadingSettings() {
        const settingsDiv = document.getElementById('readingSettings');
        settingsDiv.style.display = settingsDiv.style.display === 'none' ? 'block' : 'none';
    }

    function changeReadingCase(val) {
        readingCase = val;
        // Refresh display immediately if word is present
        if (readingCurrentWord) {
             const display = document.getElementById('readingTargetWord');
             display.textContent = readingCase === 'uppercase' ? readingCurrentWord.toUpperCase() : readingCurrentWord.toLowerCase();
        }
    }

    function buildReadingSessionWords() {
        const now = Date.now();
        const scored = readingWords.map(word => {
            const stat = readingStats[word];
            const errorRate = (stat.mistakes + 1) / (stat.shown + 1);
            const recencyBoost = stat.lastSeen ? Math.min((now - stat.lastSeen) / 10000000, 5) : 5;
            return { word, score: errorRate + recencyBoost };
        });
        scored.sort((a, b) => b.score - a.score);
        return scored.slice(0, readingSessionSize).map(x => x.word);
    }

    function initializeReadingSession() {
        readingSessionWords = buildReadingSessionWords();
        readingSessionWordIndex = 0;
        readingReviewWords = [];
        readingInReview = false;
        readingReviewIndex = 0;
        startReadingWord(readingSessionWords[0], false);
    }

    function startReadingWord(word, isReviewWord) {
        readingCurrentWord = word;
        readingGuidedRemaining = isReviewWord ? 1 : 2;
        readingStandardRemaining = isReviewWord ? 1 : 2;
        readingWordHadMistake = false;
        readingTrialHadMistake = false;
        readingCurrentStage = isReviewWord ? 'guided' : 'teach';
        renderReadingStep();
    }

    function setReadingDisplayWord() {
        const display = document.getElementById('readingTargetWord');
        display.textContent = readingCase === 'uppercase' ? readingCurrentWord.toUpperCase() : readingCurrentWord.toLowerCase();
    }

    function updateReadingUi(phaseName, instruction, nextLabel, showNext, showParentControls) {
        document.getElementById('readingPhaseLabel').textContent = phaseName;
        document.getElementById('readingInstruction').textContent = instruction;
        const nextBtn = document.querySelector('#readingMode .next-problem-btn');
        nextBtn.textContent = nextLabel;
        nextBtn.style.display = showNext ? 'inline-block' : 'none';
        document.getElementById('readingParentControls').style.display = showParentControls ? 'flex' : 'none';
    }

    function renderReadingChoices(choiceCount) {
        const container = document.getElementById('readingChoicesContainer');
        container.innerHTML = '';
        let choices = [readingCurrentWord];
        const availableDistractors = readingWords.filter(w => w !== readingCurrentWord).sort(() => Math.random() - 0.5);
        choices.push(...availableDistractors.slice(0, choiceCount - 1));
        choices = choices.sort(() => Math.random() - 0.5);

        choices.forEach(word => {
            const choiceDiv = document.createElement('div');
            choiceDiv.className = 'reading-choice';
            const img = document.createElement('img');
            img.src = `img/${word.toLowerCase()}.jpeg`;
            img.alt = word;
            img.onerror = function() { this.style.display = 'none'; choiceDiv.textContent = word; };
            choiceDiv.appendChild(img);
            choiceDiv.onclick = () => selectReadingChoice(choiceDiv, word);
            container.appendChild(choiceDiv);
        });
    }

    function renderReadingTeachCard() {
        const container = document.getElementById('readingChoicesContainer');
        container.innerHTML = '';
        const card = document.createElement('div');
        card.className = 'reading-choice';
        const img = document.createElement('img');
        img.src = `img/${readingCurrentWord.toLowerCase()}.jpeg`;
        img.alt = readingCurrentWord;
        img.onerror = function() { this.style.display = 'none'; card.textContent = readingCurrentWord; };
        card.appendChild(img);
        container.appendChild(card);
    }

    function renderReadingStep() {
        isReadingAnimating = false;
        setReadingDisplayWord();
        const progress = readingInReview
            ? `Review ${readingReviewIndex + 1}/${readingReviewWords.length}`
            : `Word ${readingSessionWordIndex + 1}/${readingSessionWords.length}`;

        if (readingCurrentStage === 'teach') {
            renderReadingTeachCard();
            updateReadingUi(`Teach • ${progress}`, 'Read the word together, then tap Next.', 'Start Guided', true, false);
        } else if (readingCurrentStage === 'guided') {
            readingTrialHadMistake = false;
            renderReadingChoices(2);
            updateReadingUi(`Guided • ${progress}`, 'Pick the matching picture (2 choices).', 'Next', false, false);
        } else if (readingCurrentStage === 'standard') {
            readingTrialHadMistake = false;
            renderReadingChoices(4);
            updateReadingUi(`Practice • ${progress}`, 'Pick the matching picture (4 choices).', 'Next', false, false);
        } else if (readingCurrentStage === 'decode') {
            document.getElementById('readingChoicesContainer').innerHTML = '';
            updateReadingUi(`Decode • ${progress}`, 'Child reads aloud. Parent rates it below.', 'Next', false, true);
        } else if (readingCurrentStage === 'complete') {
            document.getElementById('readingChoicesContainer').innerHTML = '';
            document.getElementById('readingTargetWord').textContent = 'Great work!';
            updateReadingUi('Session Complete', 'Tap restart to run another short session.', 'Restart Session', true, false);
        }

        changeFont(document.getElementById('fontSelector').value || 'Arial');
    }

    function selectReadingChoice(choiceDiv, selectedWord) {
        if (readingCurrentStage !== 'guided' && readingCurrentStage !== 'standard') return;
        if (isReadingAnimating) return;
        isReadingAnimating = true;

        if (selectedWord === readingCurrentWord) {
            choiceDiv.classList.add('correct');
            setTimeout(() => {
                const stat = readingStats[readingCurrentWord];
                stat.shown += 1;
                stat.lastSeen = Date.now();
                if (!readingTrialHadMistake) {
                    stat.correctFirstTry += 1;
                }
                if (readingCurrentStage === 'guided') {
                    readingGuidedRemaining -= 1;
                    readingCurrentStage = readingGuidedRemaining > 0 ? 'guided' : 'standard';
                } else {
                    readingStandardRemaining -= 1;
                    readingCurrentStage = readingStandardRemaining > 0 ? 'standard' : 'decode';
                }
                isReadingAnimating = false;
                renderReadingStep();
            }, 600);
        } else {
            readingTrialHadMistake = true;
            readingWordHadMistake = true;
            readingStats[readingCurrentWord].mistakes += 1;
            choiceDiv.classList.add('incorrect');
            setTimeout(() => {
                choiceDiv.classList.remove('incorrect');
                isReadingAnimating = false;
            }, 500);
        }
    }

    function advanceReadingWord() {
        if (readingWordHadMistake && !readingReviewWords.includes(readingCurrentWord) && !readingInReview) {
            readingReviewWords.push(readingCurrentWord);
        }
        if (!readingInReview) {
            readingSessionWordIndex += 1;
            if (readingSessionWordIndex < readingSessionWords.length) {
                startReadingWord(readingSessionWords[readingSessionWordIndex], false);
                return;
            }
            if (readingReviewWords.length > 0) {
                readingInReview = true;
                readingReviewIndex = 0;
                startReadingWord(readingReviewWords[readingReviewIndex], true);
                return;
            }
            readingCurrentStage = 'complete';
            renderReadingStep();
            return;
        }
        readingReviewIndex += 1;
        if (readingReviewIndex < readingReviewWords.length) {
            startReadingWord(readingReviewWords[readingReviewIndex], true);
            return;
        }
        readingCurrentStage = 'complete';
        renderReadingStep();
    }

    function rateReadingDecode(rating) {
        if (readingCurrentStage !== 'decode') return;
        if (rating === 'almost') {
            readingWordHadMistake = true;
            readingStats[readingCurrentWord].mistakes += 1;
        } else if (rating === 'needs_help') {
            readingWordHadMistake = true;
            readingStats[readingCurrentWord].mistakes += 2;
        }
        advanceReadingWord();
    }

    function handleReadingNextStep() {
        if (readingCurrentStage === 'teach') {
            readingCurrentStage = 'guided';
            renderReadingStep();
            return;
        }
        if (readingCurrentStage === 'complete') {
            initializeReadingSession();
        }
    }


    /* --- WRITING MODE SCRIPT --- */
    const fullAlphabet = 'ABCDEFGHIJKLMNOPRSTUWYZ';
    const writingWords = ['mama', 'tata', 'kot', 'pies', 'ul', 'zebra', 'arbuz', 'okno', 'rower', 'banan', 'auto', 'felek', 'adelka', 'lew', 'kwiatek', 'cynamon'];
    let currentWritingWord = '';
    let discoveredLettersCount = 0;
    let isAnimating = false;

    function showWordSelection() {
      document.getElementById('wordSelectionContainer').style.display = 'flex';
      document.getElementById('writingGameContainer').style.display = 'none';
      
      const container = document.getElementById('wordSelectionContainer');
      container.innerHTML = '';
      
      writingWords.forEach(word => {
        const thumbnail = document.createElement('div');
        thumbnail.className = 'word-thumbnail';
        thumbnail.onclick = () => selectWord(word);
        
        const img = document.createElement('img');
        img.src = `img/${word}.jpeg`;
        img.alt = word;
        img.onerror = function() {
          this.style.display = 'none';
          thumbnail.innerHTML = `<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 12px; color: #666;">${word}</div>`;
        };
        
        thumbnail.appendChild(img);
        container.appendChild(thumbnail);
      });
    }

    function selectWord(word) {
      currentWritingWord = word.toUpperCase();
      startWritingGame();
    }

    function startWritingGame() {
      document.getElementById('wordSelectionContainer').style.display = 'none';
      document.getElementById('writingGameContainer').style.display = 'flex';
      
      isAnimating = false;
      document.querySelector('#writingMode .next-word-btn').style.display = 'none';
      discoveredLettersCount = 0;
      
      const imagePath = `img/${currentWritingWord.toLowerCase()}.jpeg`;
      document.getElementById('wordImageContainer').innerHTML = `<img src="${imagePath}" alt="${currentWritingWord}">`;
      
      const formationContainer = document.getElementById('wordFormationContainer');
      formationContainer.innerHTML = '';
      currentWritingWord.split('').forEach((_, i) => {
        const placeholder = document.createElement('div');
        placeholder.className = 'letter-placeholder';
        placeholder.id = `placeholder-${i}`;
        formationContainer.appendChild(placeholder);
      });
      
      generateLetterChoices();
    }

    function generateLetterChoices() {
      const correctLetters = currentWritingWord.toUpperCase().split('');
      const incorrectLettersCount = correctLetters.length;
      let incorrectLetters = [];
      while (incorrectLetters.length < incorrectLettersCount) {
        const randomLetter = fullAlphabet[Math.floor(Math.random() * fullAlphabet.length)];
        if (!correctLetters.includes(randomLetter) && !incorrectLetters.includes(randomLetter)) {
          incorrectLetters.push(randomLetter);
        }
      }
      let choices = [...correctLetters, ...incorrectLetters].sort(() => Math.random() - 0.5);
      const choicesContainer = document.getElementById('letterChoicesContainer');
      choicesContainer.innerHTML = '';
      choices.forEach(letter => {
        const choiceEl = document.createElement('div');
        choiceEl.className = 'letter-choice';
        choiceEl.textContent = letter;
        choiceEl.onclick = () => selectLetterChoice(choiceEl);
        choicesContainer.appendChild(choiceEl);
      });
      changeFont(document.getElementById('fontSelector').value);
    }

    function selectLetterChoice(letterEl) {
      if (isAnimating) return;
      const selectedLetter = letterEl.textContent;
      if (selectedLetter === currentWritingWord[discoveredLettersCount]) {
        isAnimating = true;
        const placeholder = document.getElementById(`placeholder-${discoveredLettersCount}`);
        const placeholderRect = placeholder.getBoundingClientRect();
        const letterRect = letterEl.getBoundingClientRect();
        
        letterEl.classList.add('moving');
        letterEl.style.position = 'fixed';
        letterEl.style.top = `${letterRect.top}px`;
        letterEl.style.left = `${letterRect.left}px`;
        
        requestAnimationFrame(() => {
          const newX = placeholderRect.left - letterRect.left;
          const newY = placeholderRect.top - letterRect.top;
          letterEl.style.transform = `translate(${newX}px, ${newY}px)`;
        });

        setTimeout(() => {
          placeholder.textContent = selectedLetter;
          placeholder.classList.add('filled');
          letterEl.remove();
          discoveredLettersCount++;
          isAnimating = false;
          if (discoveredLettersCount === currentWritingWord.length) {
            document.querySelector('#writingMode .next-word-btn').style.display = 'inline-block';
          }
        }, 500);
      } else {
        letterEl.classList.add('incorrect');
        setTimeout(() => letterEl.classList.remove('incorrect'), 500);
      }
    }

    /* --- ARITHMETIC MODE SCRIPT --- */
    let opponent1Defense, opponent2Defense, targetAttack;
    let isArithmeticAnimating = false;
    const arithmeticHeroImages = [
      'img/ironman1.jpeg',
      'img/arithmetic/ironman2.jpeg',
      'img/arithmetic/ironman3.jpeg'
    ];
    const arithmeticOpponentImages = [
      'img/arithmetic/dragon.jpeg',
      'img/arithmetic/mega.jpeg',
      'img/arithmetic/wolf.jpeg'
    ];
    const sparkleColors = ['#fff36d', '#6ee7ff', '#ff8bd1', '#9cff7e', '#c4b5fd', '#ffffff'];

    function getRandomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function getTwoRandomOpponents() {
      const shuffled = [...arithmeticOpponentImages].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 2);
    }

    function generateArithmeticProblem() {
      isArithmeticAnimating = false;
      opponent1Defense = Math.floor(Math.random() * 5) + 1;
      opponent2Defense = Math.floor(Math.random() * 5) + 1;
      targetAttack = opponent1Defense + opponent2Defense;

      const heroCard = document.getElementById('mathHeroCard');
      const opponentZone = document.getElementById('mathOpponentZone');
      const beam = document.getElementById('mathBeam');
      const overlay = document.getElementById('mathGreatJob');
      const sparkleLayer = document.getElementById('mathSparkleLayer');
      const opponents = getTwoRandomOpponents();

      heroCard.classList.remove('power-up');
      beam.classList.remove('active');
      overlay.classList.remove('show');
      sparkleLayer.innerHTML = '';
      heroCard.innerHTML = `<img src="${getRandomItem(arithmeticHeroImages)}" alt="Iron Man">`;
      opponentZone.innerHTML = '';

      [opponent1Defense, opponent2Defense].forEach((defense, index) => {
        const card = document.createElement('div');
        card.className = 'opponent-card';
        card.innerHTML = `
          <div class="defense-stat">${defense}</div>
          <img src="${opponents[index]}" alt="Opponent ${index + 1}">
        `;
        opponentZone.appendChild(card);
      });

      generateNumberChoices();
    }

    function generateNumberChoices() {
      const container = document.getElementById('numberChoicesContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const choice = document.createElement('button');
        choice.className = 'math-number-choice';
        choice.type = 'button';
        choice.textContent = i;
        choice.setAttribute('aria-label', `Choose ${i}`);
        choice.onclick = () => selectNumberChoice(choice, i);
        container.appendChild(choice);
      }
    }

    function selectNumberChoice(choiceEl, selectedNumber) {
      if (isArithmeticAnimating) return;
      choiceEl.classList.add('selected');
      if (selectedNumber === targetAttack) {
        isArithmeticAnimating = true;
        choiceEl.classList.add('success');
        playMathSuccessSound();
        runCorrectMathAnimation();
      } else {
        isArithmeticAnimating = true;
        choiceEl.classList.add('try-again');
        playTryAgainSound();
        setTimeout(() => {
          choiceEl.classList.remove('selected', 'try-again');
          isArithmeticAnimating = false;
        }, 500);
      }
    }

    function runCorrectMathAnimation() {
      const heroCard = document.getElementById('mathHeroCard');
      const beam = document.getElementById('mathBeam');
      const overlay = document.getElementById('mathGreatJob');
      const opponents = Array.from(document.querySelectorAll('#mathOpponentZone .opponent-card'));

      heroCard.classList.add('power-up');
      beam.classList.remove('active');
      void beam.offsetWidth;
      beam.classList.add('active');

      setTimeout(() => {
        opponents.forEach(opponent => opponent.classList.add('teleport'));
        createOpponentSparkles(opponents);
        overlay.classList.remove('show');
        void overlay.offsetWidth;
        overlay.classList.add('show');
      }, 520);

      setTimeout(generateArithmeticProblem, 2500);
    }

    function createOpponentSparkles(opponents) {
      const layer = document.getElementById('mathSparkleLayer');
      const layerRect = layer.getBoundingClientRect();
      layer.innerHTML = '';

      opponents.forEach(opponent => {
        const rect = opponent.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2 - layerRect.left;
        const centerY = rect.top + rect.height * 0.52 - layerRect.top;

        for (let i = 0; i < 18; i++) {
          const sparkle = document.createElement('div');
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 42 + Math.random() * 76;
          sparkle.className = 'sparkle';
          sparkle.style.left = `${centerX}px`;
          sparkle.style.top = `${centerY}px`;
          sparkle.style.setProperty('--sparkle-x', `${Math.cos(angle) * distance}px`);
          sparkle.style.setProperty('--sparkle-y', `${Math.sin(angle) * distance}px`);
          sparkle.style.setProperty('--sparkle-color', getRandomItem(sparkleColors));
          sparkle.style.animationDelay = `${Math.random() * 160}ms`;
          layer.appendChild(sparkle);
        }
      });
    }

    function getAudioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      if (!window.mathAudioContext) {
        window.mathAudioContext = new AudioContext();
      }
      if (window.mathAudioContext.state === 'suspended') {
        window.mathAudioContext.resume();
      }
      return window.mathAudioContext;
    }

    function playTone(frequency, startOffset, duration, type, gainValue) {
      const context = getAudioContext();
      if (!context) return;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, context.currentTime + startOffset);
      gain.gain.setValueAtTime(0.001, context.currentTime + startOffset);
      gain.gain.exponentialRampToValueAtTime(gainValue, context.currentTime + startOffset + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + startOffset + duration);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(context.currentTime + startOffset);
      oscillator.stop(context.currentTime + startOffset + duration + 0.03);
    }

    function playTryAgainSound() {
      playTone(260, 0, 0.12, 'sine', 0.12);
      playTone(185, 0.08, 0.16, 'sine', 0.1);
    }

    function playMathSuccessSound() {
      playTone(392, 0, 0.11, 'triangle', 0.12);
      playTone(523, 0.09, 0.13, 'triangle', 0.13);
      playTone(659, 0.19, 0.18, 'triangle', 0.12);
    }

    function initializeArithmeticMode() {
      generateArithmeticProblem();
    }

    /* --- DIGITS MODE SCRIPT --- */
    let currentDigit, isDigitsAnimating = false;

    function generateDigitsProblem() {
        document.querySelector('#digitsMode .next-problem-btn').style.display = 'none';
        isDigitsAnimating = false;

        currentDigit = Math.floor(Math.random() * 9) + 1;

        const container = document.getElementById('digitsApplesContainer');
        container.innerHTML = '';
        const applesRow = document.createElement('div');
        applesRow.className = 'apples-row';
        for (let i = 0; i < currentDigit; i++) {
            const apple = document.createElement('div');
            apple.className = 'apple';
            applesRow.appendChild(apple);
        }
        container.appendChild(applesRow);

        let choices = [currentDigit];
        while (choices.length < 4) {
            const n = Math.floor(Math.random() * 9) + 1;
            if (!choices.includes(n)) choices.push(n);
        }
        choices.sort(() => Math.random() - 0.5);

        const choicesContainer = document.getElementById('digitsNumberChoicesContainer');
        choicesContainer.innerHTML = '';
        choices.forEach(n => {
            const btn = document.createElement('button');
            btn.className = 'number-choice';
            btn.textContent = n;
            btn.onclick = () => selectDigitsChoice(btn, n);
            choicesContainer.appendChild(btn);
        });
    }

    function selectDigitsChoice(btn, n) {
        if (isDigitsAnimating) return;
        isDigitsAnimating = true;
        if (n === currentDigit) {
            btn.classList.add('correct');
            setTimeout(() => {
                document.querySelector('#digitsMode .next-problem-btn').style.display = 'inline-block';
                isDigitsAnimating = false;
            }, 600);
        } else {
            btn.classList.add('incorrect');
            setTimeout(() => {
                btn.classList.remove('incorrect');
                isDigitsAnimating = false;
            }, 500);
        }
    }

    function initializeDigitsMode() {
        generateDigitsProblem();
    }


    /* --- MODE INITIALIZATION LOGIC --- */
    function initializeMode(mode) {
        // Hide Modal
        document.getElementById('startupModal').style.display = 'none';

        // Hide all modes first
        document.getElementById('alphabetMode').style.display = 'none';
        document.getElementById('lowercaseMode').style.display = 'none';
        document.getElementById('writingMode').style.display = 'none';
        document.getElementById('arithmeticMode').style.display = 'none';
        document.getElementById('digitsMode').style.display = 'none';
        document.getElementById('readingMode').style.display = 'none';


        if (mode === 'alphabet') {
            document.getElementById('alphabetMode').style.display = 'flex';
            resetBoxes();
        } else if (mode === 'lowercase') {
            document.getElementById('lowercaseMode').style.display = 'flex';
            if (lowercasePool.length === 0 && lowercaseFailed.length === 0) {
                initializeLowercasePool();
            }
            generateLowercaseProblem();
        } else if (mode === 'writing') {
            document.getElementById('writingMode').style.display = 'flex';
            showWordSelection();
        } else if (mode === 'reading') {
            document.getElementById('readingMode').style.display = 'flex';
            initializeReadingSession();
        } else if (mode === 'arithmetic') {
            document.getElementById('arithmeticMode').style.display = 'flex';
            initializeArithmeticMode();
        } else if (mode === 'digits') {
            document.getElementById('digitsMode').style.display = 'flex';
            initializeDigitsMode();
        }
    }

    function backToModeSelection() {
      // Hide all modes
      document.getElementById('alphabetMode').style.display = 'none';
      document.getElementById('lowercaseMode').style.display = 'none';
      document.getElementById('writingMode').style.display = 'none';
      document.getElementById('arithmeticMode').style.display = 'none';
      document.getElementById('digitsMode').style.display = 'none';
      document.getElementById('readingMode').style.display = 'none';
      
      // Show Modal
      document.getElementById('startupModal').style.display = 'flex';
    }

    // --- Initial Load ---
    document.addEventListener('DOMContentLoaded', () => {
      // FORCE THE MENU TO SHOW ON LOAD
      document.getElementById('startupModal').style.display = 'flex';

      // Preload images
      preloadImages();
      writingWords.forEach(word => {
        const img = new Image();
        img.src = `img/${word.toLowerCase()}.jpeg`;
      });
      readingWords.forEach(word => {
        const img = new Image();
        img.src = `img/${word.toLowerCase()}.jpeg`;
      });
      [...arithmeticHeroImages, ...arithmeticOpponentImages].forEach(src => {
        const img = new Image();
        img.src = src;
      });
    });
  </script>
</body>
